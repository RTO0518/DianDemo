# =============================================================================
# 推理阈值配置
#
# 为什么单独抽出来：
#   甲方需求文档里写的 80% / 100% 本身标注为「演示用阈值，不是电力行业标准」。
#   真实阈值应由甲方按本单位运行规程给定（不同电压等级、不同负荷性质取值不同），
#   所以不能硬编码在代码里，也不能写死在前端。
#
# 修改方式（两种都可以）：
#   1. 直接改本文件，重启服务生效；
#   2. 界面上「规则验证 → 阈值配置」实时调整，运行期生效，重启后回到本文件的值。
#
# 每一项都会被推理链引用：改阈值会改变结论，且 trace 里会写明用的是哪个阈值。
# =============================================================================

# 负载率阈值（规则 R4）
overload_rate: 1.00          # 负载率 >= 该值判为过载
heavy_rate: 0.80             # 负载率 >= 该值判为重载

# 转供约束（规则 R5 / R6）
transfer_max_rate: 1.00      # 转供后对侧馈线允许的最高负载率
capacity_reserve_rate: 0.00  # 转供时必须预留的备用容量比例（0 = 不预留）
